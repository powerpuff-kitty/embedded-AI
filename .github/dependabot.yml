version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/recipes"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # numpy >= 2.5 requires Python >= 3.12; the recipes CI pins Python 3.11.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
