name: prepare v02 locked catalogue
on:
  push:
    branches: [feat/runnable-catalog-v02]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, package-manager-cache: false}
      - name: Resolve exact pinned build dependencies into the first reviewed lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run index && npm run check && npm run reviews:check && npm run site:build
      - name: Commit only dependency lock and generated catalogue outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- package-lock.json README.md generated/catalog.json generated/catalog.full.json generated/coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: pin audited dependency tree and regenerate v0.2 catalogue'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:feat/runnable-catalog-v02
