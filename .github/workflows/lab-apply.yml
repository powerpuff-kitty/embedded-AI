name: materialize and validate browser lab
on:
  push:
    branches: [feat/procedural-browser-lab]
    paths: ['.github/lab-capsule.*', '.github/workflows/lab-apply.yml']
permissions:
  contents: write
concurrency:
  group: browser-lab-materialization
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22, package-manager-cache: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - name: Verify and materialize locally tested sources
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          raw = base64.b64decode(''.join(Path(f'.github/lab-capsule.{i}').read_text().strip() for i in range(5)), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '6cf3d68183a306a5def4b61c51d535052ba66057113b13418774153582947d15', 'Transport checksum mismatch'
          changes = json.loads(lzma.decompress(raw))
          assert len(changes) == 33
          seen = set()
          allowed = {'README.md', 'CHANGELOG.md', 'package.json'}
          roots = {'docs', 'scripts', 'schema', 'recipes', 'primitives', 'tests', 'tests_python'}
          for change in changes:
              name = change['path']
              pure = PurePosixPath(name)
              assert not pure.is_absolute() and '..' not in pure.parts and name not in seen
              assert name in allowed or pure.parts[0] in roots, name
              seen.add(name)
              p = Path(name)
              assert not p.is_symlink() and all(not q.is_symlink() for q in p.parents)
              base = change['base_sha256']
              if base is None:
                  assert not p.exists(), f'New path already exists: {name}'
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == base, f'Base changed: {name}'
              assert isinstance(change['content'], str)
          for change in changes:
              p = Path(change['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(change['content'], encoding='utf-8')
          print(f'Materialized {len(changes)} verified source files')
          PY
      - run: npm ci --ignore-scripts
      - run: npm run lab:install
      - run: npm audit --audit-level=high && npm audit --prefix recipes/procedural --audit-level=high
      - run: npm run index && npm run check
      - run: npm run test:coverage
      - run: npm run lab:test
      - run: npm run audit -- --strict
      - run: npm run reviews:check && npm run site:build -- --with-procedural
      - name: Commit verified source files and generated outputs on feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- README.md CHANGELOG.md docs package.json generated scripts recipes primitives schema tests tests_python
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add four pinned browser adapters and eight procedural catalogue entries'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/procedural-browser-lab
          git rev-parse HEAD
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests_python/procedural_browser.py
      - run: npm run lab:observations -- runs/procedural/observations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: procedural-browser-evidence
          retention-days: 14
          path: |
            runs/procedural/
            dist/lab/
