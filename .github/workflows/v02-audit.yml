name: v02 dependency review
on:
  push:
    branches: [feat/runnable-catalog-v02]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --ignore-scripts
      - name: Print exact audit report and installed versions
        run: |
          npm ls --all
          npm audit --json || true
