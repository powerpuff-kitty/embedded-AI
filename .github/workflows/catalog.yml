name: catalog
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run test:coverage
      - run: npm run index -- --check
      - run: npm run audit -- --strict
      - run: npm run reviews:check
      - run: npm run site:build
  generate-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run audit -- --strict
      # Package/CLI parity tests consume generated exports: refresh them before npm run check.
      - run: npm run index
      - run: npm run check && npm run reviews:check && npm run site:build
      - name: Commit generated catalogue only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- README.md docs/CATALOGUE.md docs/PROCEDURAL.md generated/catalog.json generated/catalog.full.json generated/coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate catalogue README and JSON exports'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Record catalogue coverage
        run: |
          echo '### Catalogue coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat generated/coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
