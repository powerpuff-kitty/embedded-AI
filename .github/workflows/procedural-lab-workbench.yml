name: procedural lab workbench
on:
  push:
    branches: [feat/procedural-lab]
    paths: ['.github/workflows/procedural-lab-workbench.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - name: Acquire exact optional demo dependencies without lifecycle scripts
        run: |
          mkdir -p /tmp/procedural-lab-deps
          cd /tmp/procedural-lab-deps
          npm init -y
          npm install --ignore-scripts --save-exact simplex-noise@4.0.3 roughjs@4.6.6 @dgreenheck/ez-tree@1.1.0 three@0.169.0 zzfx@1.4.0
      - name: Export sources and test dependencies without Git credentials
        run: |
          mkdir -p /tmp/procedural-lab-workbench
          git archive --format=tar HEAD | gzip > /tmp/procedural-lab-workbench/source.tar.gz
          tar -czf /tmp/procedural-lab-workbench/catalog-dependencies.tar.gz node_modules
          tar -czf /tmp/procedural-lab-workbench/lab-dependencies.tar.gz -C /tmp/procedural-lab-deps .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: procedural-lab-workbench
          retention-days: 1
          path: /tmp/procedural-lab-workbench/
