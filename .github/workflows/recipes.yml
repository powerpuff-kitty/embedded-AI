name: runnable recipes and explorer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, package-manager-cache: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check && npm run reviews:check
      - run: python -m pip install -r recipes/requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests_python -v
      - name: Acquire the three explicitly selected upstream artifacts
        run: |
          python -m recipes.download silero --accept-upstream-terms
          python -m recipes.download detector --accept-upstream-terms
          python -m recipes.download pose --accept-upstream-terms
      - name: Execute real inference on synthetic fixtures
        run: python scripts/smoke-recipes.py
      - name: Include these CI observations in the private preview only
        run: |
          mkdir -p benchmarks/results/preview runs/receipts
          cp runs/benchmarks/*.json benchmarks/results/preview/
          cp .models/*.receipt.json runs/receipts/
          python -m pip freeze > runs/resolved-python.txt
          npm run site:build
      - name: Browser interaction and responsive screenshots
        run: python tests_python/browser_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runnable-catalogue-evidence
          retention-days: 14
          path: |
            dist/
            runs/benchmarks/
            runs/browser/
            runs/receipts/
            runs/resolved-python.txt
            runs/forecast/evaluation.json
            runs/vad.json
            runs/pose.jsonl
