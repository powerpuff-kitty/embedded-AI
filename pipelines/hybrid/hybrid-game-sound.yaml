recipe:
  status: design
  components:
  - id: smollm
    role: Propose an allowlisted sound preset from game events.
  - id: zzfx
    role: Render bounded effect parameters.
  - id: zzfxm
    role: Render separately authored musical patterns.
  contracts:
  - The model selects approved presets; duration, gain, simultaneous voices and total buffer memory are
    hard-limited.
  - Music patterns and sequences must be supplied; the synthesizer does not autonomously compose them.
  - Activate audio through user interaction and keep a deterministic event log; randomized synthesis requires
    explicit replay tests.
