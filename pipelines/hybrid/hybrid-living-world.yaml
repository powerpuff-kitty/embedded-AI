    role: Optional dialogue and bounded action proposals; select a specific checkpoint.
  - id: ez-tree
    role: Render vegetation from authoritative world-state parameters.
  - id: yuka
    role: Execute non-learned steering and behaviour transitions.
  contracts:
  - A simulation ledger owns entity creation, deletion, resources, growth and decay; model output cannot
    mutate it directly.
  - Validate model-proposed intents against an allowlisted JSON schema, budgets and current state.
  - Store initial state, event log, RNG state and component versions; rendering never becomes the source
    of truth.
